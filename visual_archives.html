<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Photographic Archives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="archive-header">
        <h1>National Still Picture Archive</h1>
        <p>Official Visual Records and Historical Holdings</p>
        <a href="archives.html" class="back-btn">← Return to Main Archives</a>
    </header>

    <main class="archive-container">
        <!-- Category Section -->
        <section class="archive-section">
            <h2>Series I: Geographical pictures</h2>
            
            <div class="photo-grid">
                <!-- Archival Item 1 -->
                <figure class="archive-item">
                    <div class="image-wrapper">
                        <img src="oria_montes_3-23-26.webp" alt="Picture of the National Park of Oria Montes, taken March 23rd, 2026." loading="lazy">
                    </div>
                    <figcaption class="photo-meta">
                        <span class="item-id">Record ID: RG-01-IMG-001</span>
                        <p class="photo-desc">The first picture of a Mabruenian province.</p>
                        <span class="photo-date">Date: March 23rd, 2026.</span>
                    </figcaption>
                </figure>
                 </div>
        </section>
    </main>

</body>
</html>
