<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Photographic Archives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="archive-header">
        <h1>National Still Picture Archive</h1>
        <p>Official Visual Records and Historical Holdings</p>
        <a href="index.html" class="back-btn">← Return to Main Archives</a>
    </header>

    <main class="archive-container">
        <!-- Category Section -->
        <section class="archive-section">
            <h2>Series I: National Symbols & State Events</h2>
            
            <div class="photo-grid">
                <!-- Archival Item 1 -->
                <figure class="archive-item">
                    <div class="image-wrapper">
                        <img src="images/national-flag.webp" alt="Official flag of the micronation flying outside the capital" loading="lazy">
                    </div>
                    <figcaption class="photo-meta">
                        <span class="item-id">Record ID: RG-01-IMG-001</span>
                        <p class="photo-desc">The official raising of the national flag during Independence Day ceremonies.</p>
                        <span class="photo-date">Date: July 1, 2025</span>
                    </figcaption>
                </figure>

                <!-- Archival Item 2 -->
                <figure class="archive-item">
                    <div class="image-wrapper">
                        <img src="images/treaty-signing.webp" alt="Government officials signing an official decree" loading="lazy">
                    </div>
                    <figcaption class="photo-meta">
                        <span class="item-id">Record ID: RG-01-IMG-002</span>
                        <p class="photo-desc">Signing of the Border Harmonization Treaty with neighboring territory.</p>
                        <span class="photo-date">Date: February 14, 2026</span>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

</body>
</html>
